services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: reelmap
      POSTGRES_PASSWORD: reelmap
      POSTGRES_DB: reelmap
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelmap -d reelmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://reelmap:reelmap@db:5432/reelmap
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: [".:/app"]

  worker:
    build: .
    command: rq worker --url redis://redis:6379/0 reels
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://reelmap:reelmap@db:5432/reelmap
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: [".:/app"]

volumes:
  pgdata:
