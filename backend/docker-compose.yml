services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: reelmap
      POSTGRES_PASSWORD: reelmap
      POSTGRES_DB: reelmap
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://reelmap:reelmap@db:5432/reelmap
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [db, redis]
    volumes: [".:/app"]

  worker:
    build: .
    command: rq worker --url redis://redis:6379/0 reels
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://reelmap:reelmap@db:5432/reelmap
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    volumes: [".:/app"]

volumes:
  pgdata:
