<!-- The nosh wordmark.

     Two deliberate changes from the supplied file:
     - the opaque white <rect> is gone, so the mark sits on whatever is behind
       it rather than punching a white box into the cream canvas (and a glaring
       one in dark mode);
     - fill is currentColor, so it inherits the theme.

     viewBox cropped to the ink (x 8.9-111.3, y 20.2-54.3) plus a 2 unit margin.
     The original 121x72 canvas was a third empty vertically, which made the
     mark render small and sit low in any box sized by height. -->
