# XcodeGen spec — run `xcodegen generate` to produce ReelMap.xcodeproj.
#
# Paid-account build: includes the Share Extension (Instagram/TikTok/YouTube →
# Share → ReelMap) and the shared App Group. One-time setup in Xcode: with
# automatic signing, open Signing & Capabilities for BOTH the ReelMap and
# ShareExtension targets and confirm the App Group `group.com.yourco.reelmap`
# is checked (Xcode registers it with your developer account the first time).
name: ReelMap
options:
  bundleIdPrefix: com.yourco.reelmap
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "98B96Q5HQP"
    # Every Info.plist here is generated, so none of them carry a version of
    # their own — Xcode fills CFBundleShortVersionString/CFBundleVersion from
    # these two settings. Unset, SharedKit.framework shipped without them and
    # App Store Connect rejected the upload (code 90057).
    #
    # Bump CURRENT_PROJECT_VERSION for every upload: App Store Connect refuses
    # a version+build pair it has already seen.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
    # The deployed backend. Works from anywhere — cellular, other Wi-Fi, a
    # friend's phone — which LAN addresses never did.
    API_BASE_URL: "https://r2r-production-727a.up.railway.app"
    # Host for Universal Links (invite links). No longer the API's host: the
    # marketing site is the public face, and Vercel proxies /join/* and
    # /.well-known/apple-app-site-association through to Railway, so the file
    # is served from this origin with no redirect — which is what iOS requires.
    APP_LINK_DOMAIN: "noshmap.app"

targets:
  ReelMap:
    type: application
    platform: iOS
    sources: [ReelMap]
    dependencies:
      - target: SharedKit
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap
        # ReelMap/Assets.xcassets/AppIcon.appiconset — one 1024x1024 source,
        # Xcode derives every device size (including the 120x120/152x152 App
        # Store Connect rejected the upload over — codes 90022/90023/90713)
        # from it at build time.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only — there's no iPad layout anywhere in this app. Declaring
        # it explicitly means Apple stops expecting iPad-sized assets/behavior
        # we never built.
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: ReelMap/ReelMap.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yourco.reelmap]
        # The refresh token lives here rather than in App Group defaults: it's
        # the credential that mints new sessions, and the Share Extension needs
        # to read it without ever being able to show sign-in UI.
        keychain-access-groups: ["$(AppIdentifierPrefix)com.yourco.reelmap"]
        # Sign in with Apple. Enabling the capability on the App ID in the
        # developer portal is only half of it — without this entitlement in the
        # binary, ASAuthorizationController fails with AuthorizationError 1000
        # ("unknown"), which says nothing about the actual cause.
        com.apple.developer.applesignin: ["Default"]
        # Invite links open the app instead of Safari. Both hosts are listed:
        # the apex is canonical, but a link someone typed or a client rewrote
        # with www. should still open the app rather than bouncing to Safari.
        com.apple.developer.associated-domains:
          - "applinks:$(APP_LINK_DOMAIN)"
          - "applinks:www.$(APP_LINK_DOMAIN)"
        # Push ("your pins are ready"). Requires the paid Developer Program —
        # on a free personal team signing fails with "Push Notifications is not
        # available". Delete this line to build without it; the app still works,
        # you just have to open it to see new pins.
        #
        # Flips between two values and is committed either way, so check it
        # before you build: "production" for a TestFlight or App Store archive,
        # because Apple rejects a development-entitled upload; "development"
        # for Run-to-device, which is what day-to-day testing uses.
        #
        # Currently set for an archive. Put it back to development, re-run
        # `xcodegen generate`, and commit once the upload is away.
        aps-environment: production
    info:
      path: ReelMap/Info.plist
      properties:
        CFBundleDisplayName: Nosh
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        # Shown in the "Allow Nosh to use your location?" prompt — required or
        # the map's blue-dot / center-on-me feature silently does nothing.
        NSLocationWhenInUseUsageDescription: "Nosh centers the map on your location so you can see saved spots near you."
        # canOpenURL returns false for undeclared third-party schemes, which
        # would silently downgrade every deep link to its web fallback. These
        # were in the checked-in Info.plist but not here, so every `xcodegen
        # generate` quietly dropped them.
        LSApplicationQueriesSchemes: [instagram, comgooglemaps]
        # No landscape layout exists anywhere in the app.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]


  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    dependencies:
      - target: SharedKit
        embed: false   # uses the framework embedded in the host app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yourco.reelmap]
        # Same group as the app so the extension can read the refresh token and
        # re-authenticate on its own.
        keychain-access-groups: ["$(AppIdentifierPrefix)com.yourco.reelmap"]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Nosh
        API_BASE_URL: $(API_BASE_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  SharedKit:
    type: framework
    platform: iOS
    sources: [SharedKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap.SharedKit
        GENERATE_INFOPLIST_FILE: YES

# The scheme, declared here rather than left to Xcode ------------------------
#
# Nothing in this file used to define a scheme, so the only schemes that ever
# existed were the ones Xcode autocreates on open. Those live in
# ReelMap.xcodeproj/xcuserdata/, and `xcodegen generate` replaces the whole
# .xcodeproj bundle — so every regeneration deleted them, and Xcode re-created
# them inconsistently, which is why the app scheme kept going missing from
# Product > Scheme > Manage Schemes right when it was needed for an archive.
#
# Declared here it is written into xcshareddata by XcodeGen, survives every
# regeneration, and is the same for anyone who clones the repo.
#
# Named "Nosh" because everything the user sees already is; the target keeps
# the name ReelMap, which only appears in Xcode and in file paths. Renaming the
# target would mean renaming source folders and bundle identifiers, which is a
# much larger change for no visible gain.
schemes:
  Nosh:
    build:
      targets:
        ReelMap: all
      parallelizeBuild: true
      buildImplicitDependencies: true
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
