# XcodeGen spec — run `xcodegen generate` to produce ReelMap.xcodeproj.
#
# Paid-account build: includes the Share Extension (Instagram/TikTok/YouTube →
# Share → ReelMap) and the shared App Group. One-time setup in Xcode: with
# automatic signing, open Signing & Capabilities for BOTH the ReelMap and
# ShareExtension targets and confirm the App Group `group.com.yourco.reelmap`
# is checked (Xcode registers it with your developer account the first time).
name: ReelMap
options:
  bundleIdPrefix: com.yourco.reelmap
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "98B96Q5HQP"
    # Set ONCE and forget: your Mac's Bonjour name resolves to whatever LAN IP
    # DHCP hands it, so this URL keeps working even when the IP changes.
    #   1. On the Mac, run:  scutil --get LocalHostName
    #   2. Put that name here with a ".local" suffix (spaces become "-").
    # e.g. name "Dirgh-MacBook-Air" -> http://Dirgh-MacBook-Air.local:8000
    # (Simulator can still use http://localhost:8000. Same Wi-Fi required —
    #  for cellular use a tunnel like ngrok instead.)
    API_BASE_URL: "http://Dirghs-MacBook-Pro-2.local:8000"

targets:
  ReelMap:
    type: application
    platform: iOS
    sources: [ReelMap]
    dependencies:
      - target: SharedKit
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap
    entitlements:
      path: ReelMap/ReelMap.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yourco.reelmap]
    info:
      path: ReelMap/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        # Shown in the "Allow ReelMap to use your location?" prompt — required or
        # the map's blue-dot / center-on-me feature silently does nothing.
        NSLocationWhenInUseUsageDescription: "ReelMap centers the map on your location so you can see saved spots near you."
        # DEV: resolving the Mac's ".local" Bonjour name needs local-network access.
        NSLocalNetworkUsageDescription: "ReelMap connects to your development backend on the local network."
        NSBonjourServices: ["_http._tcp"]
        # DEV ONLY: lets the device talk to your Mac's backend over plain HTTP.
        # Remove before shipping (production uses HTTPS).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    dependencies:
      - target: SharedKit
        embed: false   # uses the framework embedded in the host app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yourco.reelmap]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ReelMap
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  SharedKit:
    type: framework
    platform: iOS
    sources: [SharedKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap.SharedKit
        GENERATE_INFOPLIST_FILE: YES
