# XcodeGen spec — run `xcodegen generate` to produce ReelMap.xcodeproj.
#
# DEFAULT = free-account build: runs in the Simulator and on your own iPhone with
# a free Apple ID. No App Group / Sign in with Apple / Push (those need the paid
# $99/yr Developer Program). You log in with the DEBUG dev button and add reels by
# pasting the link.
#
# TO ENABLE THE NATIVE INSTAGRAM SHARE (paid account): see ios/README.md →
# "Enabling the Share Extension" — uncomment the ShareExtension target + the app's
# entitlements/embed below.
name: ReelMap
options:
  bundleIdPrefix: com.yourco.reelmap
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "98B96Q5HQP"
    # For the Simulator use localhost. For a physical iPhone, set this to your
    # Mac's LAN IP, e.g. http://192.168.1.20:8000  (find it: ipconfig getifaddr en0)
    API_BASE_URL: "http://192.168.1.78:8000"

targets:
  ReelMap:
    type: application
    platform: iOS
    sources: [ReelMap]
    dependencies:
      - target: SharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap
    info:
      path: ReelMap/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        # DEV ONLY: lets the device talk to your Mac's backend over plain HTTP.
        # Remove before shipping (production uses HTTPS).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  SharedKit:
    type: framework
    platform: iOS
    sources: [SharedKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap.SharedKit
        GENERATE_INFOPLIST_FILE: YES

  # ---- Paid-account only: native Instagram share sheet ----
  # Uncomment this target AND the app's `entitlements` + `embed` dependency
  # (see ios/README.md) once you have the Apple Developer Program + an App Group.
  #
  # ShareExtension:
  #   type: app-extension
  #   platform: iOS
  #   sources: [ShareExtension]
  #   dependencies:
  #     - target: SharedKit
  #   settings:
  #     base:
  #       PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap.share
  #   entitlements:
  #     path: ShareExtension/ShareExtension.entitlements
  #     properties:
  #       com.apple.security.application-groups: [group.com.yourco.reelmap]
  #   info:
  #     path: ShareExtension/Info.plist
  #     properties:
  #       NSExtension:
  #         NSExtensionPointIdentifier: com.apple.share-services
  #         NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
  #         NSExtensionAttributes:
  #           NSExtensionActivationRule:
  #             NSExtensionActivationSupportsWebURLWithMaxCount: 1
  #             NSExtensionActivationSupportsText: true
