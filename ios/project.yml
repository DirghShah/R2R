# XcodeGen spec — run `xcodegen generate` to produce ReelMap.xcodeproj.
#
# Paid-account build: includes the Share Extension (Instagram/TikTok/YouTube →
# Share → ReelMap) and the shared App Group. One-time setup in Xcode: with
# automatic signing, open Signing & Capabilities for BOTH the ReelMap and
# ShareExtension targets and confirm the App Group `group.com.yourco.reelmap`
# is checked (Xcode registers it with your developer account the first time).
name: ReelMap
options:
  bundleIdPrefix: com.yourco.reelmap
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "98B96Q5HQP"
    # For the Simulator use localhost. For a physical iPhone, set this to your
    # Mac's LAN IP, e.g. http://192.168.1.20:8000  (find it: ipconfig getifaddr en0)
    API_BASE_URL: "http://192.168.1.78:8000"

targets:
  ReelMap:
    type: application
    platform: iOS
    sources: [ReelMap]
    dependencies:
      - target: SharedKit
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap
    entitlements:
      path: ReelMap/ReelMap.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yourco.reelmap]
    info:
      path: ReelMap/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        # DEV ONLY: lets the device talk to your Mac's backend over plain HTTP.
        # Remove before shipping (production uses HTTPS).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    dependencies:
      - target: SharedKit
        embed: false   # uses the framework embedded in the host app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yourco.reelmap]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ReelMap
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  SharedKit:
    type: framework
    platform: iOS
    sources: [SharedKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourco.reelmap.SharedKit
        GENERATE_INFOPLIST_FILE: YES
